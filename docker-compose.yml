# -----------------------------------------------------------------------------
# NexusCore ERP • Stack Configuration for Dockhand
# Tailored for Oracle Cloud Infrastructure (ARM64 Ampere A1) & Ubuntu Linux
# -----------------------------------------------------------------------------

name: nexus-erp

services:
  # ===========================================================================
  # 1. POSTGRESQL 16 DATABASE
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_secure_pass_2026}
    command: >
      postgres 
      -c shared_buffers=512MB 
      -c effective_cache_size=1536MB 
      -c work_mem=16MB 
      -c maintenance_work_mem=128MB 
      -c max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # 2. NEXUSCORE APPLICATION (Go Engine + Embedded Next.js 15 UI)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-nexus_secure_pass_2026}@postgres:5432/${DB_NAME:-nexus_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-nexus_super_secret_jwt_key_change_me}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ENVIRONMENT: production
      STORAGE_PATH: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  app_data:
